name: Health check

on:
  schedule:
    # Hourly uptime probe. The endpoint checks the app and the database.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Set the APP_URL repository variable (for example https://your-domain.com)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 "$APP_URL/api/health"
